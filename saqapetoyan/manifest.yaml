name: saqapetoyan
title: Բառգրքույկ. Նոր և նորակազմ բառեր հայերենում
title_translit: Bargrkuyk. Nor ev norakazm barer hayerenum
title_en: A Wordbook. New and Newly-coined Words in Armenian
title_ru: Словарик. Новые и новообразованные слова в армянском
author: R.K. Sakapetoyan (Ռ.Կ. Սաքապետոյան)
author_armenian: Ռ.Կ. Սաքապետոյան
editor: prof. Y. Avetisyan (պրոֆ. Յ. Ավետիսյան)
english_consultant: Karapet Sakapetoyan (Կարապետ Սաքապետոյան)
publisher: Yerevan State University Press (ԵՊՀ հրատարակչություն)
institute: Yerevan State University (Երևանի պետական համալսարան)
year: 2014
isbn: 978-5-8084-1849-3
pages: 80
language: hye
script: Armenian
domain: lexicology
sub_domain: neologisms (նորակազմ բառեր) — native Armenian coinages
  proposed as replacements for foreign loanwords
register: prescriptive / standard literary
structure: >
  Alphabetical glossary. Each entry: HEADWORD (the foreign loanword,
  in Armenian script) – POS. [(domain tag)] [encyclopaedic definition ՝]
  NATIVE-COINAGE, <russian equivalent>, <english equivalent>.
  Front matter pp. 1-8 (title, preface ԱՌԱՋԱԲԱՆ, abbreviations list);
  body glossary pp. 9-76; alphabetical index pp. 77-78; colophon p. 79-80.
extraction:
  type: text_layer
  ocr_engine: null  # PDF carries a clean embedded Unicode text layer
  quality: clean across all 79 pages; Armenian/Russian/English all
    preserved verbatim.
  files:
    - saqapetoyan_neologisms.pdf
  outputs:
    - path: out/full.jsonl       # raw line layer
      schema: "{page, bbox, text_raw, text, ocr_conf}"
      records: 1622
    - path: out/entries.jsonl    # structured per-entry layer (body pp.9-76)
      schema: "{headword, homograph, pos, domain[], lang_origin[], definition,
        native_coinages[], ru, en, multi_sense, stray, raw, warnings[]}"
      records: 614
      builder: parse_entries.py
      validator: validate_entries.py  # golden_entries.tsv + structural invariants
  usage_caveats:  # see README § "Read this before USING the structured data"
    - native_coinages are PRESCRIPTIVE PROPOSALS, not attested usage
      (e.g. Մսադոնդող for холодец has ~zero real usage); definition is
      the reliable meaning signal.
    - many headwords are Russian-origin loanwords; headword+ru is a
      signal for colloquial/spoken register.
    - ru present for 614/614 entries; en for 613/614.
    - inverse map coinage->headword usable for synonyms/glosses
      (some coinages are common words, not rare).
source: user-provided (~/Downloads/305269.pdf)
